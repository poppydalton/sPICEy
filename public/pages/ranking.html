<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking | PepTalk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header py-3">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="mb-1">PepTalk</h1>
                <p class="mb-0 text-muted">Pepper facts, recipes, and ranks</p>
            </div>
            <nav class="nav-links">
               <a href="../index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Recipes</a>
                <a href="facts.html">Facts</a>
                <a href="ranking.html">Ranking</a>
                <a href="contact.html">Contact</a>
                <a href="admin.html">Admin</a>
                <a href="auth.html">Login</a>
            </nav>
        </div>
    </div>
</header>

<main class="container py-4">
    <section class="card">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
            <div>
                <h2 class="mb-1">Pepper rankings</h2>
                <p class="mb-0 text-muted">Sort by name, average size, or Scoville heat.</p>
            </div>

            <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0" for="sortSelect">Sort by</label>
                <select id="sortSelect" class="form-select" style="width: auto; min-width: 220px;">
                    <option value="name">Name</option>
                    <option value="size-asc">Size: small to large</option>
                    <option value="size-desc">Size: large to small</option>
                    <option value="scoville-asc">Scoville: mild to hot</option>
                    <option value="scoville-desc">Scoville: hot to mild</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Size</th>
                        <th>Scoville</th>
                    </tr>
                </thead>
                <tbody id="rankingRows"></tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p class="mb-2">silver_ruins</p>
        <a href="https://github.com/silver-ruins" target="_blank">GitHub Profile</a>
    </div>
</footer>

<script>
const peppers = [
  { name: 'Bell Pepper', size: 3.5, scoville: 0 },
  { name: 'Poblano', size: 4.5, scoville: 1500 },
  { name: 'Jalapeño', size: 2.5, scoville: 5000 },
  { name: 'Serrano', size: 2.0, scoville: 15000 },
  { name: 'Cayenne', size: 2.8, scoville: 40000 },
  { name: 'Thai Chili', size: 1.5, scoville: 75000 },
  { name: 'Habanero', size: 2.0, scoville: 350000 },
  { name: 'Ghost Pepper', size: 3.0, scoville: 1000000 },
  { name: 'Carolina Reaper', size: 2.2, scoville: 2000000 }
];

const sortSelect = document.getElementById('sortSelect');
const rankingRows = document.getElementById('rankingRows');

function formatSize(value) {
  return `${value.toFixed(1)} in`;
}

function formatScoville(value) {
  return `${value.toLocaleString()} SHU`;
}

function sortPeppers(mode) {
  const list = [...peppers];

  switch (mode) {
    case 'size-asc':
      return list.sort((a, b) => a.size - b.size);
    case 'size-desc':
      return list.sort((a, b) => b.size - a.size);
    case 'scoville-asc':
      return list.sort((a, b) => a.scoville - b.scoville);
    case 'scoville-desc':
      return list.sort((a, b) => b.scoville - a.scoville);
    case 'name':
    default:
      return list.sort((a, b) => a.name.localeCompare(b.name));
  }
}

function renderRanking() {
  const mode = sortSelect.value;
  const sorted = sortPeppers(mode);

  rankingRows.innerHTML = sorted.map((pepper, index) => `
    <tr>
      <td>${index + 1}</td>
      <td>${pepper.name}</td>
      <td>${formatSize(pepper.size)}</td>
      <td>${formatScoville(pepper.scoville)}</td>
    </tr>
  `).join('');
}

sortSelect.addEventListener('change', renderRanking);
renderRanking();
</script>

</body>
</html>
